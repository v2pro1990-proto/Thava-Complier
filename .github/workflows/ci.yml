name: CI Build & Release

on:
  push:
    branches: [ "main", "codex/global-write-ci" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x86-64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile thavac for Windows x64
        shell: bash
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -s src/thavac.cpp -Isrc -o thavac.exe

      - name: Smoke test compiler
        shell: bash
        run: |
          ./thavac.exe --help || true
          ./thavac.exe examples/01_hello_world.thv -o test_hello.exe
          ./test_hello.exe
          ./thavac.exe examples/01_hello_world.thv --target win-arm64 -o test_hello_win_arm64.exe

      - name: Verify global writes
        run: python tests/gw_verify.py ./thavac.exe

      - name: Set up MSVC for i686
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build and test the Windows i686 compiler
        run: |
          cl.exe /nologo /O2 /MT /std:c++17 /EHsc /utf-8 /bigobj src\thavac.cpp /Isrc /Fe:thavac-windows-i686.exe /link /MACHINE:X86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/i686_verify.py ./thavac-windows-i686.exe

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: thavac-windows-x64
          path: thavac.exe

      - name: Upload Windows i686 artifact
        uses: actions/upload-artifact@v4
        with:
          name: thavac-windows-i686
          path: thavac-windows-i686.exe

  build-windows-arm64:
    name: Build Windows ARM64 (Experimental)
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC for ARM64 cross-compilation
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Compile thavac for Windows ARM64
        run: |
          cl.exe /O2 /std:c++17 /EHsc /utf-8 src\thavac.cpp /Isrc /Fe:thavac-windows-arm64.exe

      - name: Execute global-write fixture on Windows ARM64
        run: python tests/gw_verify.py ./thavac-windows-arm64.exe --run-windows-arm64

      - name: Verify the Windows ARM64 C++ toolchain target
        run: python tests/i686_verify.py ./thavac-windows-arm64.exe --windows-arm64

      - name: Upload Windows ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: thavac-windows-arm64
          path: thavac-windows-arm64.exe

  build-linux:
    name: Build Linux (x86-64 and ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and cross-compilers
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-aarch64-linux-gnu file qemu-user

      - name: Compile thavac for Linux x86-64
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -s src/thavac.cpp -Isrc -o thavac-linux-x64
          chmod +x thavac-linux-x64

      - name: Compile thavac for Linux ARM64 (aarch64)
        run: |
          aarch64-linux-gnu-g++ -O3 -std=c++17 -Wall -Wextra -s src/thavac.cpp -Isrc -o thavac-linux-arm64
          chmod +x thavac-linux-arm64

      - name: Smoke test Linux x86-64 compiler
        run: |
          ./thavac-linux-x64 examples/01_hello_world.thv -o test_hello
          chmod +x test_hello
          ./test_hello

      - name: Smoke test Native ARM64 binary emitter
        run: |
          qemu-aarch64 -L /usr/aarch64-linux-gnu ./thavac-linux-arm64 examples/01_hello_world.thv --arm64 -o test_hello_arm64
          qemu-aarch64 ./test_hello_arm64

      - name: Verify global writes on ELF and AArch64
        run: python3 tests/gw_verify.py ./thavac-linux-x64

      - name: Upload Linux x86-64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: thavac-linux-x64
          path: thavac-linux-x64

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: thavac-linux-arm64
          path: thavac-linux-arm64

  test-linux-i686:
    name: Run Linux i686
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit build dependencies and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-multilib qemu-user

      - name: Build and test the Linux i686 compiler
        run: |
          g++ -m32 -march=i686 -O2 -std=c++17 -static -s src/thavac.cpp -o thavac-linux-i686
          python3 tests/i686_verify.py ./thavac-linux-i686 --ish-syscalls
          sh build-ish.sh --tests/i686_ish.thv -o test-ish
          qemu-i386 -r 4.20.69-ish ./test-ish

      - name: Upload Linux i686 artifact
        uses: actions/upload-artifact@v4
        with:
          name: thavac-linux-i686
          path: thavac-linux-i686

  release:
    name: Publish Release
    needs: [build-windows-x64, build-windows-arm64, build-linux, test-linux-i686]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package release binaries
        run: |
          mkdir -p release-assets

          # Package Windows x64
          mkdir -p pkg-win-x64
          cp thavac-windows-x64/thavac.exe pkg-win-x64/thavac.exe
          cp LICENSE UNICODE-LICENSE.txt README.md pkg-win-x64/
          cp -r examples docs workload pkg-win-x64/
          (cd pkg-win-x64 && zip -r ../release-assets/thavac-windows-x64.zip .)

          # Package Windows ARM64
          mkdir -p pkg-win-arm64
          cp thavac-windows-arm64/thavac-windows-arm64.exe pkg-win-arm64/thavac.exe
          cp LICENSE UNICODE-LICENSE.txt README.md pkg-win-arm64/
          cp -r examples docs workload pkg-win-arm64/
          (cd pkg-win-arm64 && zip -r ../release-assets/thavac-windows-arm64.zip .)

          # Package Windows i686
          mkdir -p pkg-win-i686
          cp thavac-windows-i686/thavac-windows-i686.exe pkg-win-i686/thavac.exe
          cp LICENSE UNICODE-LICENSE.txt README.md pkg-win-i686/
          cp -r examples docs workload pkg-win-i686/
          (cd pkg-win-i686 && zip -r ../release-assets/thavac-windows-i686.zip .)

          # Package Linux x64
          mkdir -p pkg-linux-x64
          cp thavac-linux-x64/thavac-linux-x64 pkg-linux-x64/thavac
          chmod +x pkg-linux-x64/thavac
          cp LICENSE UNICODE-LICENSE.txt README.md pkg-linux-x64/
          cp -r examples docs pkg-linux-x64/
          (cd pkg-linux-x64 && zip -r ../release-assets/thavac-linux-x64.zip .)

          # Package Linux ARM64
          mkdir -p pkg-linux-arm64
          cp thavac-linux-arm64/thavac-linux-arm64 pkg-linux-arm64/thavac
          chmod +x pkg-linux-arm64/thavac
          cp LICENSE UNICODE-LICENSE.txt README.md pkg-linux-arm64/
          cp -r examples docs pkg-linux-arm64/
          (cd pkg-linux-arm64 && zip -r ../release-assets/thavac-linux-arm64.zip .)

          # Package Linux i686, including the iSH launcher and smoke test.
          mkdir -p pkg-linux-i686
          cp thavac-linux-i686/thavac-linux-i686 pkg-linux-i686/
          cp LICENSE UNICODE-LICENSE.txt README.md build-ish.sh tests/i686_ish.thv pkg-linux-i686/
          cp -r examples docs pkg-linux-i686/
          chmod +x pkg-linux-i686/thavac-linux-i686 pkg-linux-i686/build-ish.sh
          (cd pkg-linux-i686 && zip -r ../release-assets/thavac-linux-i686.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/thavac-windows-x64.zip
            release-assets/thavac-windows-arm64.zip
            release-assets/thavac-windows-i686.zip
            release-assets/thavac-linux-x64.zip
            release-assets/thavac-linux-arm64.zip
            release-assets/thavac-linux-i686.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
